# https://mpv.io/manual/master/

# Disabled since I'm not watching anime/cartoons rn
# Optimized shaders for lower-end GPU: Mode A (Fast)
# glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"

slang=en
alang=en
sub-auto=fuzzy
sub-font="Adwaita Sans"
sub-font-size=28
sub-hinting=native

profile=high-quality

# Disabled to fix instability and hitching
# video-sync=display-resample

# Disabled in favor of lsfg-vk
# interpolation

# Reduce latency to help with lsfg-vk, incompatible with interpolation
# video-latency-hacks=yes

hwdec=auto

# Start in fullscreen mode by default.
fs=yes

# Use a large seekable RAM cache even for local input.
cache=yes
# Use extra large RAM cache (needs cache=yes to make it useful).
demuxer-max-bytes=100M
demuxer-max-back-bytes=50M

osc=no
osd-duration=5000
osd-font="Adwaita Sans"
osd-back-color=1.0/0.0/0.0/1.0

save-position-on-quit
watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y

# Align to top on laptop to be more eye-level
video-align-y=-1
